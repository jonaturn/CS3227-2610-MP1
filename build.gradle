plugins {
    id 'java'
    id 'checkstyle'
    id 'jacoco'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'info.solidsoft.pitest' version '1.19.0'
}

def automatedTestExclusions = ['staniz/gui/**']

java {
    // The toolchain states which JDK builds the project, not just which bytecode is emitted, so a
    // machine without JDK 25 fails with an explicit toolchain message instead of "invalid source
    // release: 25". Gradle selects any detected JDK 25, including the one JAVA_HOME points at.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

jacoco {
    toolVersion = '0.8.15'
}

dependencies {
    implementation 'com.google.code.gson:gson:2.13.2'
    String javaFxVersion = '17.0.7'
    String jUnitVersion = '5.14.4'

    implementation "org.openjfx:javafx-base:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-base:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-controls:${javaFxVersion}:linux"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
    implementation "org.openjfx:javafx-graphics:${javaFxVersion}:linux"

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    enableAssertions = true
    useJUnitPlatform {
        excludeTags 'gui'
    }

    // UiTestPlanCoverageTest reads the plan, so it gets the absolute path rather than guessing at
    // the working directory. Declaring the file as an input makes editing the plan rerun the suite;
    // otherwise Gradle treats the task as up to date and the drift check never runs.
    systemProperty 'staniz.ui.plan', file('test/ui-test-plan.md').absolutePath
    inputs.file('test/ui-test-plan.md').withPropertyName('uiTestPlan')

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

tasks.register('guiTest', Test) {
    description = 'Runs JavaFX interaction scenarios on a desktop (or under xvfb on Linux).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'gui'
    }
    systemProperty 'prism.order', 'sw'
    systemProperty 'staniz.gui.artifacts', layout.buildDirectory.dir('gui-test').get().asFile.absolutePath
    enableAssertions = true
    failFast = true
    testLogging {
        events 'passed', 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

test.finalizedBy jacocoTestReport

jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude automatedTestExclusions
    })
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
}

pitest {
    pitestVersion = '1.25.8'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['staniz.*']
    targetTests = ['staniz.model.*', 'staniz.service.*', 'staniz.storage.*']
    excludedClasses = ['staniz.gui.*']
    threads = 4
    mutators = ['DEFAULTS']
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
}

application {
    mainClass = 'staniz.gui.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'staniz.jar'
    destinationDirectory = layout.projectDirectory.dir('release')
}

run {
    enableAssertions = true
}
