name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx
      - name: Build and check with Gradle
        # shadowJar is included so the released JAR is proven to package on every platform,
        # not only when it is rebuilt by hand before a submission.
        run: ./gradlew check shadowJar
      - name: Exercise JavaFX controls on a virtual desktop
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew guiTest
